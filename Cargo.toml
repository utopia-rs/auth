[package]
name = "utopia-auth"
description = "Password hashes, proofs, session stores, JWT issuers and verifiers, OAuth2 server values and WebAuthn passkeys with utopia-php/auth semantics."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"

[dependencies]
aes = "0.8"
ctr = "0.9"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
indexmap = "2"
md-5 = "0.10"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
php-std = { version = "0.1.0", git = "https://github.com/utopia-rs/php-std" }
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
sha2 = { version = "0.10", features = ["oid"] }
thiserror = "2"