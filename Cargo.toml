[package]
name = "utopia-auth"
description = "Password hashes, proofs and session stores compatible with utopia-php/auth."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"

[dependencies]
aes = "0.8"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
bcrypt = "0.17"
ctr = "0.9"
getrandom = "0.3"
hex = "0.4"
md-5 = "0.10"
scrypt = { version = "0.11", default-features = false }
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"